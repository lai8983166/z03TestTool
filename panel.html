<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Z03 自动化工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", sans-serif; font-size: 13px; display: flex; height: 100vh; background: #1e1f22; color: #d6d6d6; }

    /* 左侧：流程列表 */
    #sidebar { width: 180px; flex-shrink: 0; background: #2a2b30; border-right: 1px solid #111; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    #sidebar h3 { font-size: 12px; color: #8a8f98; font-weight: normal; margin-bottom: 2px; }
    .flow-btn { padding: 9px 10px; border: 1px solid #444; border-radius: 4px; background: #3a3d44; color: #d6d6d6; cursor: pointer; text-align: left; }
    .flow-btn:hover:not(:disabled) { background: #474b54; }
    .flow-btn:disabled { opacity: 0.45; cursor: default; }
    .flow-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

    /* 右侧：状态栏 + 日志 */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #2a2b30; border-bottom: 1px solid #111; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #777; }
    .dot.green { background: #3fb950; }
    .dot.red { background: #f85149; }
    #status { min-width: 48px; }
    #current-flow { color: #8a8f98; }
    button { padding: 5px 18px; border: 1px solid #444; border-radius: 4px; background: #3a3d44; color: #d6d6d6; cursor: pointer; }
    button:hover:not(:disabled) { background: #474b54; }
    button:disabled { opacity: 0.4; cursor: default; }
    #log { flex: 1; overflow-y: auto; padding: 10px 14px; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
    .line { padding: 1px 0; }
    .line.warn { color: #d29922; }
    .line.error { color: #f85149; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3>流程列表</h3>
    <div id="flow-list"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <span class="dot" id="dot"></span>
      <span id="status">空闲</span>
      <span id="current-flow"></span>
      <span style="flex:1"></span>
      <button id="btn-stop" disabled>停止</button>
    </div>
    <div id="log"></div>
  </div>
  <script src="panel.js" defer></script>
</body>
</html>
