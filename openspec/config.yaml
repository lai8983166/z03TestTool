context: |
  术语约定：被自动化的外部 Web 工具统称「上位机服务」，禁止以目录名"7-31"称呼它（部署目录不固定）。
  架构：Z03testTool（Electron）通过隐藏窗口驱动上位机服务页面（http://localhost:8080，手动经 start.bat 启动），
  流程硬编码于 flow.js 的 flows 注册表；上位机服务的元素 id 与数据产物（data/ 下 xlsx 等）是稳定契约，
  不改动上位机服务代码。

